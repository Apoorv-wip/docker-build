name: Build and publish to GHCR

on:
  push:
    tags:
      - "v*.*.*" # e.g., v1.0.0
  workflow_dispatch:

jobs:
  publish:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: myapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Compute the tag safely and export IMAGE to the job env
      - name: Compute image tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="dev"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Also tag :latest on version tags (optional)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          LATEST="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          docker tag "$IMAGE" "$LATEST"
          docker push "$LATEST"

      - name: Output
        run: echo "Pushed $IMAGE"
